[project]
name = "chute"
version = "0.1.0"
description = "Internal merge-train bot for a single monorepo"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pyjwt>=2.15.1",
    "pydantic-settings>=2.16.2",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17.3",
    "ty>=0.0.96",
]

[project.scripts]
chute = "chute.main:run"
chute-dev = "chute.main:run_dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chute"]

[tool.ruff]
line-length = 100
target-version = "py312"
